# Production environment: three API replicas spread across availability zones, HTTPS on the load balancer.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: d-services-prod
resources:
  - ../../base
images:
  # Replace 111111111111 with the AWS account ID and pin newTag to a released commit SHA.
  - name: d-services/api
    newName: 111111111111.dkr.ecr.ap-southeast-2.amazonaws.com/d-services/api
    newTag: latest
  - name: d-services/courier-web
    newName: 111111111111.dkr.ecr.ap-southeast-2.amazonaws.com/d-services/courier-web
    newTag: latest
patches:
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target: { kind: Ingress, name: d-services }
    patch: |-
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1listen-ports
        value: '[{"HTTP": 80}, {"HTTPS": 443}]'
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1ssl-redirect
        value: "443"
      # Replace with the ARN of the AWS Certificate Manager certificate for the production domain
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
        value: arn:aws:acm:ap-southeast-2:111111111111:certificate/REPLACE-ME
