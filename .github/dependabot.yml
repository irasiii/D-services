version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
  # npm workspaces (root lockfile covers packages/* and apps/*)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Base images of the container builds
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/courier-web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
  # Terraform providers
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
