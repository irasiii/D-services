# Local development database. Credentials here are for local use only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dservices
      POSTGRES_PASSWORD: dservices
      POSTGRES_DB: dservices
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
